<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Background decorative lines -->
  <path d="M 150 250 L 200 250 M 600 250 L 650 250" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
  <polyline points="150,220 150,280" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />
  <polyline points="650,220 650,280" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />

  <!-- Surrounding Concepts -->
  <!-- Top Area -->
  <text x="400" y="150" font-family="'Inter', 'Segoe UI', sans-serif" font-size="32" font-weight="bold" fill="#93c5fd" text-anchor="middle">Members</text>
  <text x="220" y="150" font-family="'Inter', 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#bfdbfe" text-anchor="middle">Child Class</text>
  <text x="580" y="160" font-family="'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="500" fill="#60a5fa" text-anchor="middle">Inheritance</text>
  <text x="350" y="80" font-family="'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#7dd3fc" text-anchor="middle">Get</text>
  <text x="480" y="90" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#bae6fd" text-anchor="middle">Set</text>

  <!-- Left Area -->
  <text x="210" y="240" font-family="'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#93c5fd" text-anchor="middle">Methods</text>
  <text x="120" y="120" font-family="'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#3b82f6" text-anchor="middle">Interface</text>
  <text x="160" y="320" font-family="'Inter', 'Segoe UI', sans-serif" font-size="30" font-weight="bold" fill="#bfdbfe" text-anchor="middle">Constructor</text>
  <text x="120" y="420" font-family="'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#e2e8f0" text-anchor="middle">Late Binding</text>
  <text x="240" y="380" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#7dd3fc" text-anchor="middle">Destructor</text>

  <!-- Right Area -->
  <text x="580" y="250" font-family="'Inter', 'Segoe UI', sans-serif" font-size="30" font-weight="bold" fill="#bfdbfe" text-anchor="middle">Classes</text>
  <text x="700" y="130" font-family="'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="400" fill="#60a5fa" text-anchor="middle">Singleton</text>
  <text x="680" y="330" font-family="'Inter', 'Segoe UI', sans-serif" font-size="26" font-weight="600" fill="#f8fafc" text-anchor="middle">Public</text>
  <text x="720" y="390" font-family="'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="500" fill="#7dd3fc" text-anchor="middle">Protected</text>
  <text x="750" y="190" font-family="'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#bae6fd" text-anchor="middle">Instances</text>
  <text x="630" y="300" font-family="'Inter', 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#e2e8f0" text-anchor="middle">Private</text>

  <!-- Bottom Area -->
  <text x="450" y="240" font-family="'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#f1f5f9" text-anchor="middle">Objects</text>
  <text x="430" y="350" font-family="'Inter', 'Segoe UI', sans-serif" font-size="26" font-weight="500" fill="#60a5fa" text-anchor="middle">Polymorphism</text>
  <text x="520" y="400" font-family="'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="400" fill="#3b82f6" text-anchor="middle">Properties</text>
  <text x="550" y="450" font-family="'Inter', 'Segoe UI', sans-serif" font-size="32" font-weight="bold" fill="#93c5fd" text-anchor="middle">Encapsulation</text>
  <text x="320" y="420" font-family="'Inter', 'Segoe UI', sans-serif" font-size="24" font-weight="500" fill="#38bdf8" text-anchor="middle">Abstraction</text>
</svg>
