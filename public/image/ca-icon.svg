<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- CPU Block -->
  <rect x="250" y="50" width="300" height="200" rx="10" fill="rgba(6, 182, 212, 0.05)" stroke="#06b6d4" stroke-width="3" filter="url(#glow)"/>
  <text x="400" y="85" font-family="'Inter', sans-serif" font-size="24" font-weight="bold" fill="#22d3ee" text-anchor="middle">CPU</text>

  <!-- Control Unit -->
  <rect x="270" y="100" width="100" height="80" rx="5" fill="rgba(59, 130, 246, 0.1)" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="130" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#93c5fd" text-anchor="middle">CONTROL</text>
  <text x="320" y="150" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#93c5fd" text-anchor="middle">UNIT</text>

  <!-- ALU -->
  <polygon points="450,180 500,100 550,180" fill="rgba(234, 179, 8, 0.1)" stroke="#eab308" stroke-width="2"/>
  <text x="500" y="160" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" fill="#fde047" text-anchor="middle">ALU</text>

  <!-- Registers -->
  <rect x="270" y="195" width="260" height="40" rx="5" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="220" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" fill="#6ee7b7" text-anchor="middle">REGISTERS</text>

  <!-- CPU internal lines -->
  <line x1="370" y1="140" x2="450" y2="140" stroke="#f472b6" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="375,135 370,140 375,145" fill="#f472b6"/>
  <polygon points="445,135 450,140 445,145" fill="#f472b6"/>

  <line x1="320" y1="180" x2="320" y2="195" stroke="#f472b6" stroke-width="2"/>
  <line x1="500" y1="180" x2="500" y2="195" stroke="#f472b6" stroke-width="2"/>

  <!-- Main Memory -->
  <rect x="620" y="80" width="140" height="140" rx="10" fill="rgba(168, 85, 247, 0.05)" stroke="#a855f7" stroke-width="3" filter="url(#glow)"/>
  <text x="690" y="115" font-family="'Inter', sans-serif" font-size="18" font-weight="bold" fill="#d8b4fe" text-anchor="middle">MAIN</text>
  <text x="690" y="135" font-family="'Inter', sans-serif" font-size="18" font-weight="bold" fill="#d8b4fe" text-anchor="middle">MEMORY</text>
  <rect x="640" y="150" width="100" height="15" fill="rgba(168, 85, 247, 0.2)" stroke="#d8b4fe"/>
  <rect x="640" y="175" width="100" height="15" fill="rgba(168, 85, 247, 0.2)" stroke="#d8b4fe"/>
  <rect x="640" y="200" width="100" height="15" fill="rgba(168, 85, 247, 0.2)" stroke="#d8b4fe"/>

  <!-- I/O Modules -->
  <rect x="50" y="320" width="160" height="120" rx="10" fill="rgba(239, 68, 68, 0.05)" stroke="#ef4444" stroke-width="3" filter="url(#glow)"/>
  <text x="130" y="355" font-family="'Inter', sans-serif" font-size="18" font-weight="bold" fill="#fca5a5" text-anchor="middle">I/O MODULES</text>
  <rect x="80" y="380" width="40" height="30" rx="2" fill="none" stroke="#fca5a5" stroke-width="2"/>
  <rect x="140" y="380" width="40" height="10" rx="1" fill="none" stroke="#fca5a5" stroke-width="2"/>
  <rect x="140" y="400" width="40" height="10" rx="1" fill="none" stroke="#fca5a5" stroke-width="2"/>

  <!-- System Bus -->
  <rect x="300" y="320" width="460" height="120" rx="10" fill="rgba(255, 255, 255, 0.02)" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10"/>
  <text x="530" y="345" font-family="'Inter', sans-serif" font-size="20" font-weight="bold" fill="#cbd5e1" text-anchor="middle">SYSTEM BUS</text>
  
  <!-- Address Bus -->
  <line x1="320" y1="370" x2="740" y2="370" stroke="#06b6d4" stroke-width="4"/>
  <text x="530" y="365" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#67e8f9" text-anchor="middle">ADDRESS BUS</text>

  <!-- Data Bus -->
  <line x1="320" y1="400" x2="740" y2="400" stroke="#eab308" stroke-width="4"/>
  <text x="530" y="395" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#fde047" text-anchor="middle">DATA BUS</text>

  <!-- Control Bus -->
  <line x1="320" y1="430" x2="740" y2="430" stroke="#a855f7" stroke-width="4"/>
  <text x="530" y="425" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#d8b4fe" text-anchor="middle">CONTROL BUS</text>

  <!-- Connecting Lines to Bus -->
  <!-- CPU to Bus -->
  <line x1="400" y1="250" x2="400" y2="370" stroke="#06b6d4" stroke-width="3"/>
  <line x1="430" y1="250" x2="430" y2="400" stroke="#eab308" stroke-width="3"/>
  <line x1="460" y1="250" x2="460" y2="430" stroke="#a855f7" stroke-width="3"/>

  <!-- Memory to Bus -->
  <line x1="690" y1="220" x2="690" y2="370" stroke="#06b6d4" stroke-width="3"/>
  <line x1="710" y1="220" x2="710" y2="400" stroke="#eab308" stroke-width="3"/>
  <line x1="730" y1="220" x2="730" y2="430" stroke="#a855f7" stroke-width="3"/>

  <!-- I/O to Bus -->
  <line x1="210" y1="370" x2="320" y2="370" stroke="#06b6d4" stroke-width="3"/>
  <line x1="210" y1="400" x2="320" y2="400" stroke="#eab308" stroke-width="3"/>
  <line x1="210" y1="430" x2="320" y2="430" stroke="#a855f7" stroke-width="3"/>

  <!-- Floating dots for data -->
  <circle cx="400" cy="300" r="4" fill="#67e8f9"/>
  <circle cx="430" cy="330" r="4" fill="#fde047"/>
  <circle cx="690" cy="280" r="4" fill="#67e8f9"/>
  <circle cx="260" cy="400" r="4" fill="#fde047"/>
</svg>
